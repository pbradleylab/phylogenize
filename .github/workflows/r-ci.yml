name: R CI

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/r-ci.yml"
      - "package/phylogenize/**"
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/r-ci.yml"
      - "package/phylogenize/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R_KEEP_PKG_SOURCE: yes
  R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Tests (R ${{ matrix.r-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["oldrel-1", "release"]

    defaults:
      run:
        working-directory: package/phylogenize

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package/phylogenize
          extra-packages: |
            any::devtools
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Run unit tests
        run: |
          mkdir -p test-results
          Rscript -e 'devtools::test(reporter = testthat::JunitReporter$new(file = "test-results/testthat.xml"))'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r-${{ matrix.r-version }}
          path: package/phylogenize/test-results
          if-no-files-found: ignore

      - name: Print session info
        if: always()
        run: Rscript -e 'sessionInfo()'

  r-cmd-check:
    name: R CMD check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package/phylogenize

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package/phylogenize
          extra-packages: |
            any::rcmdcheck
          needs: check

      - name: Run R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes", "--timings"), check_dir = "check", error_on = "warning")'

      - name: Upload R CMD check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-results
          path: package/phylogenize/check
          if-no-files-found: ignore

      - name: Print session info
        if: always()
        run: Rscript -e 'sessionInfo()'
