name: R CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  r-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package/phylogenize

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package/phylogenize
          extra-packages: |
            any::devtools
            any::rcmdcheck
          needs: check

      - name: Run testthat tests
        run: Rscript -e 'devtools::test()'

      - name: Run R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes"), error_on = "warning")'
